name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same ref cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- Guards: cheap checks that fail fast -----------------------------

      - name: Guard — no secrets committed
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development)$|\.pem$|\.p12$|(^|/)id_rsa$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret or credential files are tracked by git:"
            echo "$tracked"
            exit 1
          fi
          echo "No secret files tracked."

      - name: Guard — architecture import rules
        run: npm run check:arch

      # --- Verification ----------------------------------------------------

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        id: build
        run: npm run build

      - name: Guard — Three.js stays out of the first load
        run: npm run check:bundle

      - name: Build size
        # Also when the bundle guard fails: that is when the sizes matter most.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "### Build output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist >> $GITHUB_STEP_SUMMARY
          find dist -type f \( -name '*.js' -o -name '*.css' \) -exec ls -lh {} \; \
            | awk '{print $9, $5}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
