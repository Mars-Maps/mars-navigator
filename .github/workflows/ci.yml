name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same ref cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- Guards: cheap checks that fail fast -----------------------------

      - name: Guard — no secrets committed
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development)$|\.pem$|\.p12$|(^|/)id_rsa$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret or credential files are tracked by git:"
            echo "$tracked"
            exit 1
          fi
          echo "No secret files tracked."

      - name: Guard — files match the project manifest
        run: node .github/build/check-slice.mjs "${{ github.event.pull_request.base.sha }}"

      - name: Guard — architecture import rules
        run: npm run check:arch

      # --- Verification ----------------------------------------------------
      # Each step runs as soon as the part of the project it checks exists.

      - name: TypeScript
        run: |
          if [ -d src ]; then npm run typecheck; else echo "No sources yet."; fi

      - name: Lint
        run: |
          if [ -d src ]; then npm run lint; else echo "No sources yet."; fi

      - name: Tests
        run: npx vitest run --passWithNoTests

      - name: Production build
        id: build
        if: ${{ hashFiles('src/main.tsx') != '' }}
        run: npm run build

      - name: Guard — Three.js stays out of the first load
        if: ${{ hashFiles('src/main.tsx') != '' }}
        run: npm run check:bundle

      - name: Build size
        # Also when the bundle guard fails: that is when the sizes matter most.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          echo "### Build output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist >> $GITHUB_STEP_SUMMARY
          find dist -type f \( -name '*.js' -o -name '*.css' \) -exec ls -lh {} \; \
            | awk '{print $9, $5}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
